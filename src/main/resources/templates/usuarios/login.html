<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Sistema de biblioteca</h1>

    <h2>Entrar</h2>
    <p style="color:red" th:if="${erroLogin}" th:text="${erroLogin}"></p>
    <p style="color:green" th:if="${sucesso}" th:text="${sucesso}"></p>
    <form th:action="@{/usuarios/login}" method="post">
        <p><label>Login: <input type="text" name="login" required></label></p>
        <p><label>Senha: <input type="password" name="senha" required></label></p>
        <button type="submit">Entrar</button>
    </form>

    <h2>Registrar</h2>
    <form th:action="@{/usuarios/registro}" th:object="${usuario}" method="post">
        <p><label>Nome: <input type="text" th:field="*{nome}"></label> <span style="color:red" th:errors="*{nome}"></span></p>
        <p><label>Login: <input type="text" th:field="*{login}"></label> <span style="color:red" th:errors="*{login}"></span></p>
        <p><label>Senha: <input type="password" th:field="*{senha}"></label> <span style="color:red" th:errors="*{senha}"></span></p>
        <button type="submit">Registrar</button>
    </form>
</body>
</html>
