<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Obras do autor</title>
</head>
<body>
    <a th:href="@{/autores}">&larr; Voltar</a>

    <h1 th:text="${autor.nome}"></h1>
    <p th:text="'Nacionalidade: ' + ${autor.nacionalidade}"></p>

    <h2>Obras publicadas</h2>
    <p th:if="${#lists.isEmpty(autor.obrasPublicadas)}">Nenhum livro ainda.</p>
    <ul>
        <li th:each="livro : ${autor.obrasPublicadas}"
            th:text="${livro.titutlo} + ' (ISBN ' + ${livro.isbn} + ')'"></li>
    </ul>

    <h2>Adicionar livro a este autor</h2>
    <form th:action="@{/autores/obras/{i}/livros(i=${indice})}" th:object="${novoLivro}" method="post">
        <label>Título: <input type="text" th:field="*{titutlo}" required></label>
        <label>ISBN: <input type="text" th:field="*{isbn}"></label>
        <button type="submit">Adicionar</button>
    </form>
</body>
</html>
