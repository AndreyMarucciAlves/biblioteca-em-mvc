<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autores</title>
</head>
<body>
    <a th:href="@{/livros}">Início</a>
    <h1>Autores</h1>
    <a th:href="@{/autores/autor}">Novo</a>
    <table border="1" cellpadding="6">
        <tr><th>Nome</th><th>Nacionalidade</th><th></th><th></th><th></th></tr>
        <tr th:each="autor, s : ${autores}">
            <td th:text="${autor.nome}"></td>
            <td th:text="${autor.nacionalidade}"></td>
            <td><a th:href="@{/autores/obras/{i}(i=${s.index})}">Ver obras</a></td>
            <td><a th:href="@{/autores/autor/{i}(i=${s.index})}">Editar</a></td>
            <td>
                <form th:action="@{/autores/autor/{i}(i=${s.index})}" th:method="delete">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
